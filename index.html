<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where in Canada is Mr. Coomer?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #ffeb3b;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input, select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        button {
            background: #ff5722;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #e64a19;
        }
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 15px auto;
            border: 3px solid #ffeb3b;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1>Where in Canada is Mr. Coomer?</h1>
            <p>Enter your detective details to begin!</p>
            
            <input type="text" id="player-name" placeholder="Your Name" autocomplete="off">
            
            <select id="player-gender">
                <option value="" disabled selected>Select Gender</option>
                <option value="boy">Boy</option>
                <option value="girl">Girl</option>
            </select>

            <select id="player-hair">
                <option value="" disabled selected>Select Hair Color</option>
                <option value="brown">Brown Hair</option>
                <option value="blonde">Blonde Hair</option>
                <option value="black">Black Hair</option>
                <option value="red">Red Hair</option>
            </select>

            <button onclick="startGame()">Start Game</button>
        </div>

        <!-- GAMEPLAY SCREEN (Placeholder) -->
        <div id="game-screen" class="screen">
            <h1 id="welcome-message"></h1>
            <div id="avatar-display" class="avatar-preview"></div>
            <p>Case #1: Mr. Coomer has been spotted heading north...</p>
            <button onclick="playSong()">Play Theme Song</button>
        </div>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="bg-music" loop>
        <source src="mr_coomer_song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </main>

    <script>
        function startGame() {
            const name = document.getElementById('player-name').value.trim();
            const gender = document.getElementById('player-gender').value;
            const hair = document.getElementById('player-hair').value;

            if (!name || !gender || !hair) {
                alert("Please fill in your name, gender, and hair color!");
                return;
            }

            // FIXED AVATAR LOGIC: Corrected gender mapping so boy selects boy and girl selects girl
            let avatarSeed = "";
            if (gender === 'boy') {
                // Generates a boy avatar using Dicebear API based on hair color choice
                avatarSeed = `boy_${hair}_${name}`;
            } else {
                // Generates a girl avatar using Dicebear API based on hair color choice
                avatarSeed = `girl_${hair}_${name}`;
            }

            // Using Dicebear API for avatar icons
            const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(avatarSeed)}`;

            document.getElementById('welcome-message').innerText = `Detective ${name}, ready for duty!`;
            document.getElementById('avatar-display').style.backgroundImage = `url('${avatarUrl}')`;

            // Switch screens
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        }

        function playSong() {
            const music = document.getElementById('bg-music');
            music.play().catch(error => {
                console.log("Audio playback blocked or file missing:", error);
                alert("Make sure 'mr_coomer_song.mp3' is uploaded in your repository folder!");
            });
        }
    </script>
</body>
</html>
